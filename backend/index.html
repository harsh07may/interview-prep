         their own write missing, which is the one anomaly they always notice.`,
    code:[{label:"Route per request, not globally", lang:"js", code:`// Any request that has written reads from the primary for the rest of
// its life. Everything else may lag.
function db(req) {
  return req.hasWritten ? pools.primary : pools.replica;
}

app.use((req, res, next) => {
  req.hasWritten = false;
  req.db = () => db(req);
  next();
});

// Measure the lag and alert on the percentile, not the average:
--  on the primary
select client_addr, pg_wal_lsn_diff(sent_lsn, replay_lsn) as to_replay
from pg_stat_replication;
--  on the replica
select now() - pg_last_xact_replay_timestamp() as behind;`}],
    points:[
      `<b>Read-your-writes</b> is the guarantee users notice. Buy it with request-scoped routing; let everything else lag.`,
      `Reporting, exports, search indexing and analytics are natural replica workloads. Checkout is not.`,
      `Asynchronous replication means a failover can lose whatever had not shipped yet. That number is your real RPO.`,
      `Lag is bursty. Alert on a high percentile, because the average hides the spike a user hit.`],
    trap:`Sending all reads to replicas because it balances load. Every read-after-write becomes
          intermittently wrong in a way that depends on timing and cannot be reproduced on request.`,
    build:`Set up a primary and a replica locally, loop a write then an immediate replica read, and count
           how often you read the old value. Add load and watch it rise.`,
    refs:[["Postgres: monitoring replication","https://www.postgresql.org/docs/current/monitoring-stats.html"]] }

  ] },

{ num:6, id:"testing", phase:2, name:"Testing and quality",
  lede:"Tests that catch real failures, run fast, and do not need re-running to be believed.",
  topics:[

  { id:"test-levels", name:"What to test where", depth:"build", core:true,
    why:`The pyramid is a shape, not advice. The rule: test pure decisions where they are cheapest, and
         test anything crossing a boundary against the real thing, because a mock will lie to you.`,
    code:[{label:"The five tests per endpoint, every time", lang:"js", code:`describe('GET /orders/:id', () => {
  it('returns the order to its owner',        async () => expect(200));

  // The four nobody writes, and the four that fail in production:
  it('rejects an unauthenticated request',    async () => expect(401));
  it('hides another tenant\\'s order',         async () => expect(404)); // not 403
  it('404s for an id that does not exist',    async () => expect(404));
  it('rejects a malformed id',                async () => expect(400));
});

// Which level:
//   pure decision, no I/O      -> unit, exhaustively
//   SQL, migration, txn        -> integration, real database
//   status code, auth, parsing -> boundary, real HTTP via supertest
//   critical user journey      -> end to end, a handful only`}],
    points:[
      `A mocked repository returning a hand-built object proves you can build an object, not that the query works.`,
      `Status codes break in middleware, serialization and routing, so they need a real request through the real app.`,
      `Coverage counts lines executed, not assertions made. A test that calls everything and asserts nothing scores perfectly.`,
      `The highest-value test most services lack is one that simply boots the app and makes a request.`],
    trap:`400 unit tests, 92% coverage, and a release where every endpoint 500s because a config key was
          renamed. No unit test touches startup.`,
    build:`Write the five tests above for one endpoint. Then delete your config validation and run the
           suite: if it still passes, you have no test that boots the app.`,
    refs:[] },

  { id:"integration-tests", name:"Testing against a real database", depth:"build", core:true,
    why:`A mocked database cannot catch a wrong column name, a constraint violation, a bad migration or
         invalid SQL — which is most of the bugs in data access code.`,
    code:[{label:"Run against the real thing, and undo every test", lang:"js", code:`const { Client } = require('pg');
let db;

beforeAll(async () => {
  db = new Client({ connectionString: process.env.TEST_DATABASE_URL });
  await db.connect();
  await applyMigrations(db);          // the REAL migrations, not a fixture
});

// Each test runs in a transaction that is always rolled back, so the
// database is identical before and after, whatever the test did.
beforeEach(() => db.query('begin'));
afterEach(()  => db.query('rollback'));

test('rejects a duplicate email', async () => {
  await db.query("insert into users (email) values ('a@x.com')");
  await expect(db.query("insert into users (email) values ('a@x.com')"))
    .rejects.toThrow(/duplicate key/);
});

// rows before: 0  ->  2 tests pass  ->  rows after: 0`}],
    points:[
      `Same engine and major version as production. A different database is a different dialect and different plans.`,
      `Build the schema by running your real migrations, so the migrations are tested on every run too.`,
      `Rollback isolation needs no cleanup code, which is itself a thing that can be buggy.`,
      `Keep mocking third-party APIs you do not control. Everything you deploy yourself should be real.`],
    trade:`Rollback is fast and breaks if the code under test manages its own transactions. For code that
           commits in stages, truncate between tests instead and accept the slower run.`,
    trap:`Sharing one database between parallel tests without isolation. Passes alone, fails in CI,
          passes on re-run — and the team learns to re-run rather than to trust it.`,
    build:`Convert one mocked repository test to a real database with rollback. Then rename a column in a
           migration but not in the query, and confirm it fails.`,
    refs:[["Testcontainers","https://testcontainers.com/"]] },

  { id:"test-doubles", name:"What not to mock", depth:"build", core:true,
    why:`Double things at the edge: third-party APIs, the clock, randomness. Mocking your own classes
         encodes today's design into the test, so every refactor breaks tests with no behaviour change.`,
    code:[{label:"A fake that enforces the real contract", lang:"js", code:`class FakePaymentGateway {
  charges = new Map();
  nextResult = 'success';

  async charge(amountCents, currency, idempotencyKey) {
    if (this.charges.has(idempotencyKey))        // the real gateway does
      return this.charges.get(idempotencyKey);   // this, so the fake must
    if (this.nextResult === 'declined') throw new CardDeclined();
    const charge = { id: 'ch_' + idempotencyKey, amountCents };
    this.charges.set(idempotencyKey, charge);
    return charge;
  }
}

test('a client retry does not charge twice', async () => {
  await checkout(order, { key: 'k1' });
  await checkout(order, { key: 'k1' });
  expect(gateway.charges.size).toBe(1);                    // state
  expect((await order.reload()).status).toBe('paid');      // state
  // not: expect(gateway.charge).toHaveBeenCalledTimes(1)  // structure
});`}],
    points:[
      `Assert on the <b>result</b>, not the calls. State assertions survive refactoring; call assertions are the refactor's enemy.`,
      `A <b>fake</b> costs more than a mock up front and pays it back every time the code changes.`,
      `Mocks are genuinely right for one thing: proving something was <em>not</em> called, like not charging the card when validation failed.`,
      `Build a thin interface per third party and fake that, so the fake is written once and read easily.`],
    trap:`A fake more forgiving than the real dependency. If the real gateway rejects a reused
          idempotency key and your fake happily returns a fresh charge, your tests prove the opposite of the truth.`,
    build:`Find a test asserting a method was called, rewrite it to assert on state, then refactor the
           implementation and check the new test still passes.`,
    refs:[] },

  { id:"flaky-tests", name:"Flaky tests", depth:"build", core:false,
    why:`A suite people re-run is a suite nobody believes, and then a real failure gets re-run too.
         Almost all flakiness is four causes, and none of their fixes is a retry.`,
    code:[{label:"Found by running it: passes on the 15th, fails at month end", lang:"js", code:`function renew(from) {                 // code under test
  const d = new Date(from);
  d.setMonth(d.getMonth() + 1);
  return d;
}

// The test builds its input from the wall clock, then asserts the day
// of the month is unchanged after renewing:
//   2026-01-15 -> 2026-02-15   pass
//   2026-01-29 -> 2026-03-01   FAIL
//   2026-01-30 -> 2026-03-02   FAIL
//   2026-01-31 -> 2026-03-03   FAIL
//   2026-03-31 -> 2026-05-01   FAIL
//   2026-05-31 -> 2026-07-01   FAIL
//   2026-08-31 -> 2026-10-01   FAIL
// Six of seven dates fail, and the build is green on the 15th.

// Deterministic: pin the clock and assert the real behaviour.
const FIXED = new Date('2026-01-31T00:00:00Z');
expect(renew(FIXED).toISOString().slice(0, 10)).toBe('2026-03-03');`}],
    points:[
      `<b>Wall clock</b>: inject it. Month ends, leap days and DST transitions are all real failure dates.`,
      `<b>Randomness</b>: seed it and print the seed on failure.`,
      `<b>Shared state</b>: isolate in setup. <b>Order dependence</b>: randomise order in CI so it fails loudly instead of lying dormant.`,
      `Replace every <code>sleep</code> with waiting on the actual condition. CI machines are slower and more variable than laptops.`],
    trade:`Automatic retries are a tourniquet for a suite that is already untrusted. Record every retry
           so flakiness is a visible number, or the mechanism just hides it permanently.`,
    trap:`Fixing flakiness by widening the timeout. It makes the suite slower and still intermittent, and
          hides that the test is waiting on the wrong thing.`,
    build:`Run your suite with randomised order and in parallel. Whatever newly fails had the dependency
           all along.`,
    refs:[] },

  { id:"contract-testing", name:"Contract testing", depth:"understand", core:false,
    why:`Real value across teams that deploy independently, and mostly overhead inside one. Say that
         plainly before adopting it.`,
    code:[{label:"What it catches that nothing else does", lang:"text", code:`The orders service drops customer_email because nothing in ITS
codebase uses it. The notification service reads it.

  orders tests        pass  (its own fixtures)
  notification tests  pass  (its own mocks)
  deploy              green
  emails              silently stop, because the field is absent
                      rather than an error

Contract testing makes the consumer's real usage an artifact the
provider verifies in its own build:

  consumer tests  -> record the interactions actually used
                  -> publish to a broker
  provider build  -> replay every consumer's contract against a real
                     instance, and FAIL before deploying

The valuable outcome is the provider's build failing on a change that
would break a consumer it has never heard of.`}],
    points:[
      `The contract is what a consumer <b>uses</b>, not the provider's whole schema. That smaller set is what makes it useful.`,
      `Generate it from the consumer's own tests, so it cannot drift from the consumer's code.`,
      `With one team deploying everything together, an integration test across both services gives most of the same protection with none of the infrastructure.`,
      `A broker, versioning discipline and a build step on both sides is the real cost.`],
    trap:`Writing the contract from the provider's schema. It then describes everything the provider
          could return, so the provider can never change anything, which is the opposite of the intent.`,
    build:`Write down the exact fields your code reads from one service you call. It is far fewer than
           the response contains. That list is the contract.`,
    refs:[["Pact","https://docs.pact.io/"]] },

  { id:"load-testing", name:"Load, stress and soak", depth:"understand", core:false,
    why:`Three different questions, not three intensities. Running one and claiming the others is how a
         service passes its testing and falls over in week two.`,
    code:[{label:"Read the curve, not a verdict", lang:"text", code:`Target: 300 req/s sustained, p99 under 400ms, errors under 0.1%

rate    p50     p95      p99    errors   
100     22ms    48ms     91ms   0.00%
200     24ms    55ms    110ms   0.00%
300     27ms    71ms    189ms   0.00%   <- target met
400     41ms   180ms    620ms   0.00%   <- latency climbing, no errors
500     95ms   710ms   2100ms   0.02%
600    310ms  2400ms   6800ms   4.10%   <- collapse

Real capacity is ~350, not 600. The service stops meeting its target
long before it starts erroring, and only percentiles show that. The
average at 500 req/s reads about 140ms and looks fine.

(An illustration of the shape, not a measurement of any service.)`}],
    points:[
      `<b>Load</b>: does it meet its target at expected traffic. <b>Stress</b>: where does it break and does it degrade or collapse. <b>Soak</b>: does it leak over hours.`,
      `A <b>closed</b> model keeps N virtual users each waiting for a response, so slowness reduces load and hides the problem. An <b>open</b> model sends at a fixed rate, like real traffic.`,
      `Define the target as numbers before the test. "It should be fast" is not testable.`,
      `A four-minute load test cannot find a leak that needs six hours. That is what soak is for.`],
    trap:`Reporting the average. A service with p50 20ms and p99 4s has an average near 60ms and one in a
          hundred users having a terrible time.`,
    build:`Run an open-model test at rising rates until p99 breaches your target, and record the table.
           Then hold half that rate for two hours and watch memory and descriptors.`,
    refs:[] }

  ] },

{ num:7, id:"security", phase:3, name:"Auth, authorization and security",
  lede:"Who is calling, what they may do, and how not to trust anything they send.",
  topics:[

  { id:"sessions-vs-tokens", name:"Sessions, tokens and cookie flags", depth:"build", core:true,
    why:`For a first-party web app a server session is still the better default, because it can be
         revoked instantly. Tokens became fashionable by association with single-page apps.`,
    code:[{label:"Express: every flag set deliberately", lang:"js", code:`app.set('trust proxy', 1);                 // behind a TLS-terminating proxy

app.use(session({
  name: '__Host-session',                  // forces Secure, Path=/, no Domain
  secret: config.sessionSecret,
  store: new RedisStore({ client: redis }), // shared: survives a restart
  resave: false,
  saveUninitialized: false,
  cookie: {
    httpOnly: true,       // JavaScript cannot read it — the whole point
    secure:   true,       // HTTPS only
    sameSite: 'lax',      // not sent on cross-site POSTs: most of CSRF gone
    maxAge:   14 * 24 * 60 * 60 * 1000,
  },
}));

// On login, rotate the id or you have session fixation:
req.session.regenerate((err) => { req.session.userId = user.id; });`}],
    points:[
      `<b>Revocation</b> is the real difference. "Sign out everywhere" is one delete with sessions, and with stateless tokens it means waiting for expiry or building a denylist.`,
      `<code>__Host-</code> forbids a <code>Domain</code> attribute, so no subdomain — including one you do not control — can set a cookie your app reads.`,
      `<code>SameSite=Lax</code> removes most CSRF. Add a per-session token for state-changing requests if you need <code>SameSite=None</code>.`,
      `The session lookup is a cache hit measured in a fraction of a millisecond, so the performance argument for tokens is smaller than people assume.`],
    trap:`Storing a token in <code>localStorage</code> so the SPA can read it. Any XSS bug reads it too,
          which <code>HttpOnly</code> makes impossible.`,
    build:`Inspect your session cookie and check all four attributes. Try to read it from the console.
           Then log in and compare the id before and after.`,
    refs:[["OWASP: session management","https://cheatsheetseries.owasp.org/cheatsheets/Session_Management_Cheat_Sheet.html"]] },

  { id:"passwords", name:"Storing credentials", depth:"build", core:true,
    why:`You will be breached, or a backup will leak. The only question is whether the attacker gets a
         usable credential list or a pile of expensive guesses.`,
    code:[{label:"Argon2id, with no enumeration oracle", lang:"js", code:`const argon2 = require('argon2');
const OPTS = { type: argon2.argon2id, memoryCost: 65536, timeCost: 3, parallelism: 4 };

// Registration — salt and parameters are generated and encoded into
// the stored string: $argon2id$v=19$m=65536,t=3,p=4$<salt>$<hash>
const hash = await argon2.hash(password, OPTS);

// Login
const user = await users.findByEmail(email);
if (!user) {
  await argon2.verify(DUMMY_HASH, password);   // spend the same time
  return genericFailure();                     // identical response
}
if (!await argon2.verify(user.passwordHash, password)) return genericFailure();

if (argon2.needsRehash(user.passwordHash, OPTS))   // policy was raised
  await users.setHash(user.id, await argon2.hash(password, OPTS));

req.session.regenerate(...);`}],
    points:[
      `Argon2id first, bcrypt acceptable. A general-purpose hash like SHA-256 is not a password hash: a GPU tries billions a second.`,
      `Tune to a few hundred milliseconds. Higher is better against an offline attacker and worse against an online one, so rate limit login too.`,
      `Any difference between "no such account" and "wrong password" — body, status, <b>or timing</b> — tells an attacker which addresses are registered.`,
      `Reset tokens are credentials: high entropy, single use, short lived, stored hashed, and they invalidate every session on use.`],
    trap:`Returning a different message for an unknown email. Your login form becomes a tool for checking
          which of a leaked address list has accounts with you.`,
    build:`Time your login for a wrong password versus an unknown address. A measurable difference is a
           timing oracle; fix it with the dummy verify.`,
    refs:[["OWASP: password storage","https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html"],
          ["RFC 9106: Argon2","https://www.rfc-editor.org/rfc/rfc9106.html"]] },

  { id:"jwt", name:"Verifying a JWT properly", depth:"build", core:true,
    why:`The famous warnings are about <code>alg:none</code>, and current libraries already stop those.
         The live danger is accepting a perfectly valid token that was minted for someone else.`,
    code:[{label:"All four cases run against jsonwebtoken 9.0.3", lang:"js", code:`// 1. decode() checks NOTHING. Signature here is garbage.
jwt.decode(tamperedToken);
// ACCEPTED -> { sub: '42', role: 'user', aud: 'orders-api', ... }

// 2. alg:none, signature stripped — rejected either way.
jwt.verify(noneToken, KEY);                            // rejected
jwt.verify(noneToken, KEY, { algorithms: ['HS256'] }); // rejected

// 3. Algorithm confusion: forge HS256 using the RSA PUBLIC key as the
//    HMAC secret. Rejected — the library infers from the key type.
jwt.verify(forged, publicKey);                         // rejected

// 4. THE ONE THAT GETS THROUGH. Real token, correct signature, right
//    issuer, not expired — but minted for a different service.
jwt.verify(otherAudience, KEY, { algorithms: ['HS256'] });
// ACCEPTED -> '42'

jwt.verify(otherAudience, KEY, { algorithms: ['HS256'],
  audience: 'orders-api', issuer: 'https://auth.example.com' });
// rejected: jwt audience invalid. expected: orders-api`}],
    points:[
      `Call <code>verify</code>, never <code>decode</code>, and pass <b>every</b> option: algorithms, issuer, audience.`,
      `<code>exp</code> is enforced by default by good libraries. Allow a few seconds of clock tolerance.`,
      `A stateless token cannot be withdrawn. The three real answers are short expiry, a revocation denylist, or reference tokens.`,
      `Rotate refresh tokens on every use and revoke the whole family if an already-used one reappears, because that means one was stolen.`],
    trade:`A denylist restores revocation and reintroduces the per-request lookup tokens existed to
           avoid. At that point compare it honestly against a server session.`,
    trap:`Baking authorization into the token and never re-checking. A role issued an hour ago is an
          hour-old opinion, so a revoked administrator stays one until expiry.`,
    build:`Mint a token with the right signature and a <b>different audience</b>, and send it to your
           API. If it is accepted, you have just reproduced case 4 against your own service.`,
    refs:[["RFC 8725: JWT BCP","https://www.rfc-editor.org/rfc/rfc8725.html"]] },

  { id:"oauth-oidc", name:"OAuth 2.1 and OIDC", depth:"understand", core:false,
    why:`OAuth is delegated <em>authorization</em>: the token says what the holder may do. OIDC adds the
         identity layer that says who they are. Using one as the other is a standard review finding.`,
    code:[{label:"What the OAuth 2.1 draft actually says", lang:"text", code:`PKCE
  "Clients MUST use code_challenge and code_verifier and authorization
   servers MUST enforce their use except under the conditions described
   in Section 7.5.1."
  "An AS MUST reject requests without a code_challenge from public
   clients, and MUST reject such requests from other clients unless
   there is reasonable assurance that the client mitigates
   authorization code injection in other ways."

Removed
  "The Implicit grant (response_type=token) is omitted"
  "The Resource Owner Password Credentials grant is omitted"

Redirect URIs
  "MUST reject authorization requests that specify a redirect URI that
   doesn't exactly match one that was registered" (loopback excepted)

Tokens in URLs
  "clients MUST NOT send the access token in a URI query parameter,
   and resource servers MUST ignore access tokens in a URI query
   parameter."

Quoted from draft-ietf-oauth-v2-1-13. Still an Internet-Draft, so
check the current revision before citing it.`}],
    points:[
      `Authorization code flow with PKCE, via a library. The failure modes are subtle and the consequence is account takeover.`,
      `Request the narrowest scopes that do the job. A token that can do everything is a password with a shorter life.`,
      `Validate <code>state</code> on the way back, and register the exact redirect URI.`,
      `Delegating sign-in removes password storage and MFA from your codebase, and makes their outage your outage.`],
    trade:`Rarely right: building OAuth to log users into your own first-party app. A session cookie does
           that job with a fraction of the moving parts.`,
    trap:`Using the ID token as an access token, or the access token as proof of identity. The first is
          for your client, the second for the resource server.`,
    build:`Read your provider's <code>/.well-known/openid-configuration</code>, then trace one login in
           dev tools and find the <code>code_challenge</code> going out and <code>state</code> coming back.`,
    refs:[["OAuth 2.1 draft","https://datatracker.ietf.org/doc/html/draft-ietf-oauth-v2-1-13"],
          ["OpenID Connect Core","https://openid.net/specs/openid-connect-core-1_0.html"]] },

  { id:"authz-models", name:"Authorizing every object", depth:"build", core:true,
    why:`Authentication happens once and a framework does it. Authorization happens on every object and
         is hand-written, which is why the commonest serious API vulnerability is a missing ownership check.`,
    code:[{label:"Make the safe path the only path", lang:"js", code:`// Wrong: authenticated, but whose order? Nobody asked.
app.get('/orders/:id', requireAuth, async (req, res) => {
  res.json(await Order.findByPk(req.params.id));   // every user, every order
});

// Better: the check is explicit, and 404 so the response does not
// confirm that someone else's order exists.
const order = await Order.findByPk(req.params.id);
if (!order || order.tenantId !== req.user.tenantId) return res.sendStatus(404);

// Best: the scope is structural. The repository is built with the
// tenant, so a query that forgets it cannot be written.
function repoFor(tenantId) {
  return {
    findOrder: (id) => db.query(
      'select * from orders where id = $1 and tenant_id = $2', [id, tenantId]),
  };
}
app.use((req, res, next) => { req.repo = repoFor(req.user.tenantId); next(); });`},
           {label:"Or below every code path, in the database", lang:"sql", code:`alter table orders enable row level security;
create policy tenant_isolation on orders
  using (tenant_id = current_setting('app.tenant_id')::bigint);`}],
    points:[
      `<b>Deny by default.</b> If forgetting a check leaves an endpoint open, some endpoint will be open.`,
      `<b>Roles</b> stop fitting the moment a rule mentions the object: "a manager can approve expenses, but not their own".`,
      `Tenant must constrain <b>every</b> query, not the ones you remembered.`,
      `Hiding a button is a usability decision, not a security control. The endpoint is still reachable with curl.`],
    trap:`<code>GET /orders/8841</code> that checks the caller is signed in, loads the order and returns
          it. Every authenticated user can now read every order by changing the number.`,
    build:`As user A, request every id-taking endpoint using user B's ids. Every 200 is a vulnerability.
           Then move tenancy into the repository and re-run.`,
    refs:[["OWASP API Top 10: BOLA","https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/"]] },

  { id:"service-auth", name:"Service-to-service auth", depth:"understand", core:false,
    why:`"It came from inside the network" is not an identity. That assumption fails the moment anything
         inside is compromised, which is the normal shape of a serious breach.`,
    code:[{label:"Two identities, not one", lang:"text", code:`Compromised reporting tool, network trust:
  reporting -> payments.charge()      allowed, because internal

Compromised reporting tool, scoped credentials:
  reporting holds scope "orders:read"
  reporting -> payments.charge()      rejected
  blast radius stops there

Carry BOTH identities on a call:
  the calling service   -> mTLS cert, or a client-credentials token
  the end user          -> a separate signed token, propagated

Collapsing them means the downstream service cannot apply user-level
authorization, and everything ends up running as an omnipotent
principal.`}],
    points:[
      `<b>mTLS</b> puts identity in the transport. Strong, and it needs certificate issuance and rotation — usually a service mesh.`,
      `<b>Client credentials</b> reuse the OAuth machinery you may already run, and put the authorization server on the call path.`,
      `Short-lived credentials mean a leaked one expires. Workload identity means there is no static secret at all.`,
      `Each service gets only the scopes it needs. That narrowness is the entire value.`],
    trap:`One shared API key used by every service. It cannot be rotated without coordinating every
          deployment, and when it leaks you cannot tell which service leaked it.`,
    build:`List your internal calls and ask what stops an attacker with a foothold in one service from
           making each. Put a scoped credential in front of the most sensitive one.`,
    refs:[["RFC 8705: mTLS client auth","https://www.rfc-editor.org/rfc/rfc8705.html"]] },

  { id:"untrusted-input", name:"Untrusted input, four ways", depth:"build", core:true,
    why:`Injection, SSRF, path traversal and unsafe deserialization look like four vulnerabilities. They
         are one mistake in four places: a caller's value concatenated into something that gets interpreted.`,
    code:[{label:"The same fix shape each time", lang:"js", code:`// SQL injection
db.query("select * from users where email = '" + email + "'");   // wrong
db.query('select * from users where email = $1', [email]);       // right

// Dynamic identifier: cannot be a parameter, so use an allowlist.
const SORTABLE = { date: 'created_at', total: 'total_cents' };
const col = SORTABLE[req.query.sort];
if (!col) return res.sendStatus(400);
db.query(\`select * from orders order by \${col} desc\`);   // safe: ours

// Path traversal
const full = path.resolve(BASE, req.params.file);
if (!full.startsWith(path.resolve(BASE) + path.sep)) return res.sendStatus(400);

// SSRF: allowlist the destination, and re-check after EVERY redirect
const { hostname } = new URL(url);
if (!ALLOWED.has(hostname)) return res.sendStatus(400);
await fetch(url, { redirect: 'manual' });   // validate each hop yourself

// Deserialization: JSON only. Never a format that builds objects from
// untrusted bytes.`}],
    points:[
      `Parameterizing is not escaping. The value is sent separately from the statement, so it can never be parsed as SQL whatever it contains.`,
      `SSRF is dangerous because your server sits <b>inside</b> the network, where metadata endpoints have no authentication.`,
      `Blocklists fail against redirects, DNS names resolving to private addresses, and encodings. An allowlist is the only robust defence.`,
      `An allowlist will block something legitimate one day. Where being wrong means a breach, take the support ticket.`],
    trap:`Escaping instead of parameterizing. Escaping depends on getting every context right, in a
          helper someone will later reuse in a different context.`,
    build:`Grep for string concatenation near select/insert/update/delete and for file paths built from
           request values. Then check whether anything fetches a caller-supplied URL.`,
    refs:[["OWASP Top 10","https://owasp.org/www-project-top-ten/"],
          ["OWASP: SSRF prevention","https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html"]] },

  { id:"cors-headers", name:"CORS and security headers", depth:"build", core:false,
    why:`CORS is a browser rule about who may <em>read</em> a response. It is not authorization, it does
         not protect your API, and curl ignores it entirely.`,
    code:[{label:"Express: an allowlist, not a reflection", lang:"js", code:`const ALLOWED = new Set(['https://app.example.com', 'https://admin.example.com']);

app.use(cors({
  origin: (origin, cb) =>
    cb(null, !origin || ALLOWED.has(origin)),   // NEVER reflect blindly
  credentials: true,          // cannot be combined with origin '*'
  maxAge: 86400,              // stop the browser asking on every call
}));
app.use((req, res, next) => { res.vary('Origin'); next(); });

app.use(helmet({
  strictTransportSecurity: { maxAge: 31536000, includeSubDomains: true },
  contentSecurityPolicy: {    // start in report-only, read, then enforce
    directives: { defaultSrc: ["'self'"], objectSrc: ["'none'"],
                  frameAncestors: ["'none'"], baseUri: ["'self'"] },
  },
  referrerPolicy: { policy: 'strict-origin-when-cross-origin' },
}));                          // helmet sets X-Content-Type-Options too`}],
    points:[
      `<code>Vary: Origin</code> matters: without it a shared cache can serve one origin's response to another.`,
      `<b>CSP</b> is the strongest anti-XSS control available and the most disruptive to adopt. Report-only first, for long enough to see real traffic.`,
      `<code>nosniff</code> stops the browser second-guessing your <code>Content-Type</code>, which is how an uploaded "image" becomes script.`,
      `A wildcard origin plus credentials is refused by browsers, which is why people reach for reflection.`],
    trap:`Reflecting the <code>Origin</code> header back to make CORS work everywhere. That allows every
          origin including an attacker's page, which with credentials can then read authenticated responses.`,
    build:`Send an <code>Origin</code> of <code>https://evil.example</code> to your API. If it is echoed,
           you have the reflection bug. Then add CSP in report-only and read a day of reports.`,
    refs:[["MDN: CORS","https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS"],
          ["MDN: CSP","https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP"]] },

  { id:"data-protection", name:"Encryption, PII and logs", depth:"build", core:false,
    why:`Encryption at rest defends a stolen disk and almost nothing else. What reduces breach damage is
         holding less data and keeping secrets out of the systems that copy data everywhere.`,
    code:[{label:"Redaction in the logger, not in the discipline", lang:"js", code:`const REDACT = new Set(['password','token','authorization','cookie',
  'card_number','cvv','secret','api_key','refresh_token','id_token']);

function scrub(value, key) {
  if (key && REDACT.has(key.toLowerCase())) return '[redacted]';
  if (Array.isArray(value)) return value.map((v) => scrub(v));
  if (value && typeof value === 'object')
    return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, scrub(v, k)]));
  return value;
}

// pino does this natively, which is better than remembering to call scrub:
const logger = require('pino')({
  redact: { paths: ['req.headers.authorization', 'req.headers.cookie',
                    '*.password', '*.token'], censor: '[redacted]' },
});

// And the test that proves it:
// post a known password to /login, assert it appears in NO log line.`}],
    points:[
      `Encryption at rest is invisible to anyone using the application, which is most attackers who matter.`,
      `<b>Minimisation</b> is the cheapest protection. Data you never collected cannot leak.`,
      `Field-level encryption meaningfully limits a database compromise and costs you querying, indexing and sorting on those fields. Decide per field, and write down why.`,
      `A convention people must remember will be forgotten during an incident, which is when the most logging gets added.`],
    trap:`A debugging change that logs the full request body on the auth endpoint. Every password typed
          goes into your log aggregator in plain text, with a long retention, while the database was
          encrypted the whole time and it made no difference.`,
    build:`Grep a day of logs for password, token, authorization and secret. Then add redaction and write
           the test that posts a known password and asserts it appears nowhere.`,
    refs:[["OWASP: logging","https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html"]] }

  ] },

{ num:8, id:"caching", phase:3, name:"Caching and performance",
  lede:"Making it fast, and knowing which number to look at before you try.",
  topics:[

  { id:"cache-layers", name:"Which layer, and how stale", depth:"understand", core:true,
    why:`Five places a response can be held, each cheaper and staler than the last. Choosing the layer
         is most of the decision.`,
    code:[{label:"One product page, four different answers", lang:"text", code:`browser       free, closest, UNCONTROLLABLE once sent. You cannot
              invalidate it, only wait. Short max-age + revalidation.

CDN           huge leverage for static assets and public responses,
              and it can serve a cached copy while your origin is down.

reverse proxy shared cache at your edge, for public responses that are
              expensive to produce and identical for everyone.

in-process    fastest possible, and PER INSTANCE: ten instances means
              ten caches, invalidation reaches one, and two users can
              see different answers at the same moment.

distributed   Redis. One cached truth, one network hop, one more
              dependency that can fail.

  product image   -> CDN, long TTL, versioned URL
  rendered HTML   -> shared cache, 60s
  product record  -> distributed, 5min
  the user basket -> NOT CACHED, and marked private`}],
    points:[
      `Anything identical for everyone and rarely changing goes on the CDN with a versioned URL, so a change is a new URL rather than an invalidation.`,
      `Use in-process only for genuinely immutable data, or where instances disagreeing is harmless.`,
      `Mark everything else explicitly uncacheable. The dangerous case is a per-user response stored by a shared cache.`,
      `Your measured hit rate on an in-process cache is optimistic by roughly the instance count.`],
    trap:`A shared cache storing an authenticated response. The next person asking for that URL gets the
          previous user's data — a breach caused by a caching header.`,
    build:`List every piece of data on one page with the layer it belongs in and its acceptable
           staleness in seconds. Compare against what your service does today.`,
    refs:[] },

  { id:"cache-strategies", name:"Cache-aside, and the two others", depth:"build", core:true,
    why:`They get listed as peers. They are not: cache-aside is what almost everyone should use almost
         always, and write-behind is here so you can recognise it being proposed.`,
    code:[{label:"Written so the cache is allowed to fail", lang:"js", code:`async function getOrder(id) {
  const key = \`order:v2:\${id}\`;

  try {
    const hit = await redis.get(key);
    if (hit) return JSON.parse(hit);
  } catch (e) {
    metrics.increment('cache.error');      // degrade, do not fail
  }

  const order = await db.findOrder(id);    // the source of truth
  if (order) {
    try { await redis.set(key, JSON.stringify(order), 'EX', 300); }
    catch (e) { /* still return the answer */ }
  }
  return order;
}

async function updateOrder(id, changes) {
  const order = await db.updateOrder(id, changes);   // DATABASE FIRST
  try { await redis.del(\`order:v2:\${id}\`); }          // then invalidate
  catch (e) { /* the TTL is the backstop for exactly this */ }
  return order;
}`}],
    points:[
      `The property that matters is <b>failure behaviour</b>: with cache-aside a cache outage is a slowdown; with write-behind it is data loss.`,
      `<b>Delete</b> on write, do not update. Two concurrent writers can write to the cache in the opposite order from the database, leaving it permanently wrong until the TTL.`,
      `Database first, then invalidate. Invalidate first and a concurrent reader repopulates the old value in the gap.`,
      `Write-behind acknowledges writes that are not durable, which is almost never acceptable for an application database.`],
    trap:`Wrapping cache calls so an error propagates. The cache has stopped being an optimisation and
          become a dependency that can take your service down.`,
    build:`Add cache-aside to one read-heavy endpoint, then kill the cache and confirm it still serves
           correct results, slower. If it errors, that is the bug.`,
    refs:[] },

  { id:"cache-keys", name:"Keys, TTLs and invalidation", depth:"build", core:false,
    why:`The famous joke is about this: a value derived from several inputs, and when any input changes
         you must know which keys became wrong. Usually you do not.`,
    code:[{label:"Version in the key is the cheapest mass invalidation", lang:"text", code:`order:v2:8841                 one record
user:v1:42:permissions        a derived set
pricing:v3:IN:2026-11         slow-changing, by region and month

A deploy changes the cached shape:
    order:v2:*  ->  order:v3:*        one constant, changed in the
                                      same commit as the shape

Every v2 entry is instantly unreachable and expires on its own. No
flush, no mass delete, and no window where new code reads an old
structure.

TTL by how wrong you can afford to be:
    pricing table      1 hour     changes rarely, staleness visible
    order record       5 min      invalidated on write; TTL is backup
    permissions       30 sec      security-relevant, keep it short
    negative result   10 sec      stop a missing id hammering the DB`}],
    points:[
      `The <b>TTL is the correctness guarantee</b>: it is what makes a missed invalidation self-heal.`,
      `Anything derived from several inputs cannot be invalidated precisely without tracking dependencies. Use a short TTL instead.`,
      `Cache negative results briefly too, or a missing id becomes a database amplifier.`,
      `Ask what one minute of staleness actually costs the business. The answer is usually nothing.`],
    trap:`No TTL because you invalidate explicitly. Every invalidation path misses a case — a batch job,
          a manual fix, a code path added later — and without a TTL that wrong value is permanent.`,
    build:`Check every key has a version segment and a TTL. Pick a derived value and try to enumerate
           every input that could make it wrong; if the list is over two, use a short TTL and delete the code.`,
    refs:[] },

  { id:"stampedes", name:"Stampedes and hot keys", depth:"build", core:false,
    why:`A key serving a thousand requests a second expires. Every request in flight misses at the same
         instant, and the database gets a thousand copies of a query it was answering once every five minutes.`,
    code:[{label:"Measured: 200 concurrent misses on one key", lang:"js", code:`// Naive cache-aside: every concurrent miss loads independently.
//   -> 200 database calls

// Single-flight: the first miss creates the promise, the rest await it.
const inflight = new Map();

async function getHot(key) {
  const hit = await redis.get(key);
  if (hit) return JSON.parse(hit);
  if (inflight.has(key)) return inflight.get(key);     // join the first

  const p = loadFromDb(key)
    .then(async (v) => {
      const ttl = 300 + Math.floor(Math.random() * 60);  // jitter: do not
      await redis.set(key, JSON.stringify(v), 'EX', ttl); // expire together
      return v;
    })
    .finally(() => inflight.delete(key));

  inflight.set(key, p);
  return p;
}
//   -> 1 database call

// Per instance. Ten instances give ten calls, not one, which is fine.`}],
    points:[
      `Single-flight is a few lines and bounds the damage to one query per instance. A distributed lock to make it exactly one is rarely worth the complexity.`,
      `<b>Jitter</b> is nearly free and essential after a deploy or a cache flush, when keys written together would otherwise expire together.`,
      `<b>Early refresh</b> — recompute in the background before expiry while still serving the old value — means nobody ever waits. Worth it for the few keys that are both hot and expensive.`,
      `A hot key saturates one cache node, and sharding does not help because it hashes to one place.`],
    trap:`Warming the whole cache at startup with one TTL. You have built a scheduled stampede across
          your entire key space.`,
    build:`Delete a hot key, fire a few hundred concurrent requests, and count the database queries. Add
           single-flight and count again.`,
    refs:[] },

  { id:"http-caching", name:"ETags and conditional requests", depth:"build", core:true,
    why:`HTTP has a caching system built in and most APIs ignore it. Used properly the client holds the
         response and your server answers "unchanged" in a few bytes.`,
    code:[{label:"A real exchange: 304 carries a zero-byte body", lang:"js", code:`app.get('/orders/:id', async (req, res) => {
  const order = await orders.find(req.params.id, req.user.id);
  if (!order) return res.sendStatus(404);

  // Cheap validator: a row version, not a hash of the serialized body,
  // so we can answer 304 BEFORE doing the expensive work.
  const etag = \`W/"\${order.id}-\${order.version}"\`;
  res.set('ETag', etag);
  res.set('Cache-Control', 'private, max-age=0, must-revalidate');
  if (req.get('If-None-Match') === etag) return res.status(304).end();

  res.json(toApi(order));
});

// first request          200  "W/..."  24 bytes
// revalidate, unchanged  304  "W/..."   0 bytes
// revalidate, changed    200  "W/..."  27 bytes`}],
    points:[
      `<b><code>private</code> vs <code>public</code></b> is the most consequential flag. <code>public</code> lets a shared cache store a user-specific response.`,
      `<code>Vary</code> names the request headers that change the response, or a shared cache serves one variant to everyone.`,
      `An ETag from the serialized body saves bandwidth only — you had to build the response to hash it. One from a row version saves the work too.`,
      `On a list endpoint returning tens of kilobytes, a 304 is the whole payload saved on every unchanged poll.`],
    trap:`Marking a user-specific response <code>public</code>. A CDN or corporate proxy stores one
          user's data and serves it to the next person who asks for that URL.`,
    build:`Add an ETag to one read endpoint and confirm with curl that <code>If-None-Match</code> returns
           304 with an empty body. Then audit every endpoint for <code>Cache-Control</code>.`,
    refs:[["RFC 9111: HTTP Caching","https://www.rfc-editor.org/rfc/rfc9111.html"]] },

  { id:"redis", name:"Redis beyond caching", depth:"build", core:false,
    why:`It is a set of data structures over the network with atomic operations. Knowing which structure
         fits turns several awkward database designs into one command.`,
    code:[{label:"Run against Redis 7: each type doing its job", lang:"bash", code:`SET session:42 "opaque" EX 900      # expires on its own
TTL session:42
# 900

INCR views:page:7                   # atomic, no read-modify-write
# 1

HSET cart:42 sku-a 2 sku-b 1        # fields updatable one at a time
HGETALL cart:42
# sku-a 2 sku-b 1

SADD online u1 u2 u1                # the duplicate is a no-op
SCARD online
# 2

ZADD top 10 alice 30 bob 20 carol   # a leaderboard
ZREVRANGE top 0 1 WITHSCORES
# bob 30 carol 20

SET lock:job owner1 NX EX 30        # acquire: OK
SET lock:job owner2 NX EX 30        # second attempt: nil, already held`}],
    points:[
      `<b>Sorted sets</b> answer "top ten" and "this player's rank" as single commands — a sort over a large table in SQL, or a denormalized rank with a consistency problem.`,
      `Command execution is <b>single-threaded</b>, which is what makes operations atomic and means one slow command blocks every client.`,
      `Set a TTL on nearly everything. Memory is the capacity limit, and a key space that only grows will hit <code>maxmemory</code> and evict things you needed.`,
      `Use Lua when a sequence must be atomic as a whole, as the rate limiter does.`],
    trade:`Treat Redis as a cache that can be lost, not a database. If you need durability, be explicit
           about the persistence mode and test what a restart actually loses.`,
    trap:`<code>KEYS</code> in production. It walks the entire key space on the one thread serving
          everything else, so on a large instance it is an outage. <code>SCAN</code> does the same job in pieces.`,
    build:`Take something stored as a serialized blob and model it with the right structure. Measure the
           bytes for a single-field update before and after.`,
    refs:[["Redis: data types","https://redis.io/docs/latest/develop/data-types/"]] },

  { id:"bottleneck", name:"Finding the bottleneck", depth:"build", core:false,
    why:`Performance work without measurement is guessing, and the guess is usually wrong, because the
         slow part is rarely the complicated part.`,
    code:[{label:"Break the request into four numbers that add up", lang:"js", code:`// Time every boundary, not just the whole request.
async function handler(req, res) {
  const t = req.timings = {};
  t.db    = await timed(() => orders.find(req.params.id));
  t.cache = await timed(() => cache.get(key));
  t.http  = await timed(() => payments.status(id));
  // whatever is left is your own code
  req.log.info({ ...t, total: Date.now() - req.startedAt }, 'breakdown');
}

// Export latency as a HISTOGRAM, never a gauge of the mean:
const h = new promClient.Histogram({
  name: 'http_request_duration_seconds',
  labelNames: ['method', 'route', 'status'],   // route TEMPLATE, not path
  buckets: [0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5],
});`}],
    points:[
      `Work <b>top down</b>: percentiles per endpoint, then a breakdown by component, then profile whichever dominates.`,
      `A CPU profile is silent about blocking. If a request takes 400ms and uses 8ms of CPU, it is the wrong tool.`,
      `<b>Query count per request</b> catches N+1 faster than any profiler, and you can assert on it in a test.`,
      `A profile against a thousand rows tells you nothing about a million: plans change and the bottleneck moves.`],
    trap:`A sprint optimising a pricing algorithm that turns out to be 4% of the request, while an N+1
          behind an ORM relation is the other 96%.`,
    build:`Take your slowest endpoint by p99 and split its latency into database, cache, outbound and
           your own code. Four numbers that add to the total. Only the biggest is worth working on.`,
    refs:[] },

  { id:"memory-gc", name:"Memory and leaks", depth:"understand", core:false,
    why:`A script can leak and exit. A server runs for weeks, so anything unbounded eventually fills
         memory and the kernel kills it with no stack trace.`,
    code:[{label:"Measured: the commonest leak in a long-running service", lang:"js", code:`// A cache with no bound. Correct, fast, never gives anything back.
const cache = new Map();
function handle(i) {
  cache.set(\`user:\${i}\`, { id: i, profile: 'x'.repeat(1024) });
}
// heap at start:        3.5 MB
// after 200k requests: 73.7 MB   entries: 200000

// Bounded: evict the oldest at the limit. Entry count is then constant
// no matter how many requests pass through.
const LIMIT = 10_000;
function handleBounded(i) {
  if (cache.size >= LIMIT) cache.delete(cache.keys().next().value);
  cache.set(\`user:\${i}\`, { id: i, profile: 'x'.repeat(1024) });
}
// In production use lru-cache with maxSize and ttl rather than this.`}],
    points:[
      `A leak in a managed runtime is memory still <b>reachable</b> that should not be. Something is holding a reference.`,
      `Four shapes: an unbounded cache or map, a closure capturing more than it needs, a listener never removed, a collection appended to per request.`,
      `Judge from the <b>floor</b> of the sawtooth over hours. A short window always looks alarming or always looks fine.`,
      `Flat heap with rising RSS is usually fragmentation or native allocations.`],
    trap:`A service restarted every few hours with exit 137 and nothing in the logs. The process was
          OOMKilled and never got to write one.`,
    build:`Run under steady load for an hour and plot heap and RSS. If the floor rises, take two heap
           snapshots an hour apart and compare retained sizes.`,
    refs:[] },

  { id:"tail-latency", name:"Why p99 goes bad before CPU does", depth:"understand", core:false,
    why:`Teams add capacity near 100% and are surprised latency was already terrible at 80%. Queueing
         does not rise linearly with utilisation; it explodes.`,
    code:[{label:"Service time 20ms. The work per request never changes.", lang:"text", code:`util   mean wait   total latency
50%      20ms         40ms
70%      47ms         67ms
80%      80ms        100ms
90%     180ms        200ms
95%     380ms        400ms
98%     980ms       1000ms

From 50% to 98% utilisation, latency grows 25 times and the work per
request is identical. An alert at 95% CPU fires long after users
noticed.

(M/M/1 model, so this is the SHAPE, not a prediction. Real systems are
worse, because arrivals are burstier than the model assumes.)

Tail amplification: a page making 10 calls each with a p99 of 200ms
has roughly a 1-in-10 chance of containing a slow one.`}],
    points:[
      `Applies to CPU, a thread pool, a connection pool and an event loop alike.`,
      `<b>Little's law</b> for sizing: 200 requests a second at 20ms each needs about 4 concurrent slots.`,
      `Alert on <b>latency percentiles</b>, not utilisation. The percentile is what users feel and it moves first.`,
      `Treat above roughly 70% sustained as a signal to add capacity, not as evidence of efficiency.`],
    trade:`Low utilisation buys predictable latency and costs idle capacity. How close you can run to the
           edge depends on how fast you can add more.`,
    trap:`Treating high CPU as the goal of efficiency work. A service pinned at 95% has no headroom, so
          its tail is bad continuously and catastrophic occasionally.`,
    build:`Plot p99 against throughput rather than time. The rate where p99 starts climbing steeply is
           your usable capacity, and it is lower than the rate where errors begin.`,
    refs:[] }

  ] },

{ num:9, id:"concurrency", phase:4, name:"Concurrency and asynchronous work",
  lede:"Doing several things at once, on purpose, with a limit.",
  topics:[

  { id:"async-io", name:"What actually yields", depth:"build", core:true,
    why:`Async does not make anything faster. It makes waiting cheap, so the gain comes entirely from
         overlapping waits — and disappears the moment you await each one in turn.`,
    code:[{label:"Measured: the same ten 100ms calls, three ways", lang:"js", code:`// Serialised: each await finishes before the next begins.
for (const id of ids) results.push(await fetchOne(id));
//   await in a loop:      1005 ms

// Concurrent: all ten in flight, wait once.
await Promise.all(ids.map(fetchOne));
//   Promise.all:           100 ms

// Bounded: 50 items, at most 5 at a time. Ten batches of 100ms.
await mapWithLimit(items, 5, fetchOne);
//   limit of 5, 50 items: 1005 ms

async function mapWithLimit(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  async function worker() {
    while (true) {
      const i = next++;
      if (i >= items.length) return;
      out[i] = await fn(items[i]);
    }
  }
  await Promise.all(Array.from({ length: limit }, worker));
  return out;
}`}],
    points:[
      `Start the work, <em>then</em> await it. Collect promises first and await them together.`,
      `Running ten concurrently means deciding what happens when three fail. <code>Promise.all</code> rejects on the first; <code>allSettled</code> lets you handle each.`,
      `Concurrency is bounded by something whether you choose it or not. Choose it and the limit is visible and tunable; leave it and the limit is whichever downstream thing collapses first.`,
      `For CPU-bound work use <code>worker_threads</code>. No amount of <code>await</code> helps.`],
    trap:`<code>Promise.all</code> over a list of unknown length. Ten concurrent calls is an
          optimisation; ten thousand is an attack on your own database, and the list is user-supplied often enough.`,
    build:`Find an endpoint with two independent sequential awaits and make them concurrent. Then find a
           map over a user-supplied list and put a limit on it.`,
    refs:[] },

  { id:"background-jobs", name:"Moving work out of the request", depth:"build", core:true,
    why:`A request should do the minimum needed to answer correctly. Everything else makes the response
         slower, makes it likelier to fail, and ties retryable work to something that cannot be retried.`,
    code:[{label:"The rule, and the job row that is the real truth", lang:"js", code:`// POST /orders
//   IN the request (the caller needs these to answer):
//     validate, reserve stock, take payment, write the order,
//     enqueue the rest  <- in the SAME transaction as the write
//
//   IN jobs (the caller does not need the result):
//     confirmation email    retryable, external, slow
//     invoice PDF           slow, nobody is waiting
//     warehouse notify      must not fail checkout
//     recommendation model  nobody notices the delay

// The queue is delivery; the ROW is the truth.
create table jobs (
  id          bigint generated always as identity primary key,
  type        text not null,
  payload_id  bigint not null,        -- an id, never the whole object
  status      text not null default 'pending',
  attempts    int  not null default 0,
  last_error  text,
  run_after   timestamptz not null default now(),
  completed_at timestamptz
);`}],
    points:[
      `Write the job in the <b>same transaction</b> as the state change, or you can commit the order and lose the email.`,
      `Put an <b>id</b> in the payload, not the object. The object may have changed by the time the job runs.`,
      `A queued job disappears from the user's view. Status on the resource and a way to see failures are part of the feature.`,
      `Every job will run more than once. Design the handler so a repeat is harmless.`],
    trade:`A database job table is transactional with your data, queryable with SQL and trivially
           debuggable, and it polls. A broker gives push delivery and throughput, and is a second system
           that is not transactional with your database. Below a few thousand jobs a minute the table wins.`,
    trap:`Enqueuing before the transaction commits. The worker is fast enough to find no row, or the
          transaction rolls back and the email goes out for an order that does not exist.`,
    build:`Move one inline external call to a job written in the same transaction. Make the call fail
           permanently and confirm the endpoint still succeeds and the failure is visible.`,
    refs:[] },

  { id:"scheduled-work", name:"Periodic work that runs once", depth:"build", core:false,
    why:`A timer inside your service fires in every process. Three replicas means the nightly statement
         job runs three times, and nobody notices in staging where there is one instance.`,
    code:[{label:"Postgres advisory lock, verified across two sessions", lang:"sql", code:`-- Instance A                     -- Instance B, same moment
select pg_try_advisory_lock(42);  select pg_try_advisory_lock(42);
--  t   <- A runs the job         --  f   <- B SKIPS, and does not block

select pg_advisory_unlock(42);    -- A finishes
                                  select pg_try_advisory_lock(42);
                                  --  t

-- try_ rather than the blocking form: a second instance should skip
-- this run, not queue up to repeat it afterwards. The lock is tied to
-- the session, so a crashed instance releases it automatically.`}],
    points:[
      `Three failure modes appear only in production: runs on every instance, a slow run overlapping the next, and runs silently missed during a restart.`,
      `Record the start and end of every run, and <b>alert when an expected run did not happen</b>. Silent non-execution is the one nobody builds for.`,
      `Decide explicitly whether a missed run is skipped or run late. Leaving it undecided means skipped.`,
      `Assume a five-minute job will one day overlap a ten-minute schedule.`],
    trade:`In-process with a lock is zero infrastructure and versioned with the app. An external
           scheduler handles the singleton for you and makes the job a separate deployable with its own
           config drift. One or two jobs: in-process. More, or schedules non-deployers need to see: external.`,
    trap:`Assuming one instance. Every rolling deploy runs two versions at once.`,
    build:`Run three instances locally and confirm the job runs three times. Add the lock, confirm once.
           Then make it take longer than its interval and confirm the next tick skips.`,
    refs:[["Postgres: advisory locks","https://www.postgresql.org/docs/current/explicit-locking.html"]] },

  { id:"shared-state", name:"Races and atomic updates", depth:"build", core:true,
    why:`Read, decide, write is a race whenever two of anything can run at once. The check was correct
         and ran correctly, and still allowed the thing it was checking for.`,
    code:[{label:"Four fixes, in the order to try them", lang:"sql", code:`-- The race: a promo code limited to 100 uses.
--   uses = count_uses(code);  if (uses < 100) insert_use(...)
-- Under load, 140 requests all count 99 and all insert.

-- 1. One atomic statement. The database decides, once.
insert into uses (code, user_id)
select $1, $2 where (select count(*) from uses where code = $1) < 100;

-- 2. A constraint that makes the bad state impossible.
--    Give each use a sequence number, unique (code, seq), seq < 100:
--    the 101st INSERT fails rather than being politely prevented.

-- 3. Compare-and-swap on a counter.
update promo set used = used + 1
 where code = $1 and used < 100        -- 0 rows means full
returning used;

-- 4. A lock, only if none of the above fit.
select * from promo where code = $1 for update;`}],
    points:[
      `The list is ordered by how much concurrency each preserves. The familiar lock is the most expensive answer on it.`,
      `An <b>in-process mutex</b> protects one process. With two instances it protects nothing, and the bug returns the day you scale out.`,
      `Often the best answer is no lock at all: a unique constraint makes the invalid state impossible regardless of ordering.`,
      `Same shape as the lost update in the database stage, appearing in-process, across processes, and across services.`],
    trap:`Synchronising shared state with a mutex in a service that runs more than one instance. The code
          looks safe, passes every local test, and provides nothing in production.`,
    build:`Find a check-then-act — counting before inserting, checking stock before decrementing — fire
           fifty concurrent requests at it, and assert the invariant held.`,
    refs:[] },

  { id:"distributed-locks", name:"Distributed locks", depth:"understand", core:false,
    why:`Usually the wrong tool. A constraint is correct where a lock is only probable, and a lock held
         across a network can expire while its holder still believes it holds it.`,
    code:[{label:"When to use what", lang:"text", code:`Only one of N instances runs a nightly job
  -> a lease. pg_try_advisory_lock, or SET NX EX in Redis.
     Running twice is wasteful, not wrong, IF the job is idempotent.

A counter must not exceed a limit
  -> NOT a lock. An atomic conditional update.

Only one order per idempotency key
  -> NOT a lock. A unique constraint.

Exclusive access to something that cannot be made idempotent, where
running twice is genuinely harmful
  -> a lease WITH a fencing token, and the resource must check it:

     token = acquire_lease("job", ttl=60)   # 41, then 42, then 43...
     do_work()
     resource.write(data, fence=token)      # rejects anything < 43

Without the fence, "I hold the lease" means "I held it when I last
checked", which is not the same thing.`}],
    points:[
      `A distributed lock <b>must expire</b> or a crashed holder blocks everyone forever — and expiry means it can expire while the holder is still working.`,
      `A GC pause, a slow disk or a partition can stall the holder past the lease. Two processes then both believe they hold it.`,
      `Expiry is measured by clocks on different machines, which the clocks topic revisits.`,
      `Redlock's safety has been publicly disputed by serious people on both sides. That dispute is itself the argument for not relying on a lock for correctness.`],
    trade:`Making the work idempotent is almost always the better investment: idempotency is useful
           everywhere, and a lock is useful only while it holds.`,
    trap:`Treating acquisition as a guarantee for the duration of the work. It is a guarantee at the
          instant you acquired it.`,
    build:`Find a distributed lock in your systems and decide which case it is. Then ask what happens if
           the holder pauses for twice the lease, and whether anything would detect it.`,
    refs:[["Redis: distributed locks","https://redis.io/docs/latest/develop/use-cases/patterns/distributed-locks/"]] },

  { id:"backpressure", name:"Limits and shedding", depth:"build", core:false,
    why:`When work arrives faster than you can do it, rejecting some quickly beats failing all of them
         slowly. An unbounded queue turns overload into a timeout for everyone.`,
    code:[{label:"Express: shed rather than queue", lang:"js", code:`const MAX_IN_FLIGHT = 100;        // from your measured capacity, not a
let inFlight = 0;                 // round number

app.use((req, res, next) => {
  if (inFlight >= MAX_IN_FLIGHT) {
    res.set('Retry-After', '1');
    return res.status(503).json({ code: 'OVERLOADED' });
  }
  // A request already past its client's deadline is dead work.
  if (req.deadline && Date.now() > req.deadline)
    return res.status(504).json({ code: 'DEADLINE_EXCEEDED' });

  inFlight++;
  res.on('finish', () => inFlight--);
  res.on('close',  () => { if (!res.writableEnded) inFlight--; });
  next();
});

// Per-dependency budgets, so one slow upstream cannot consume them all:
//   payments 20 concurrent | search 10 | email 5`}],
    points:[
      `Without a limit, latency climbs until everything times out and you spend capacity producing responses nobody is waiting for.`,
      `A rejected request is a clear signal the client can act on. A 40-second timeout tells it nothing useful and consumed your capacity.`,
      `Set the limit from the rate where p99 starts climbing, not where errors start.`,
      `Each dependency gets its own budget. That is the bulkhead from the reliability stage.`],
    trap:`Adding a queue to absorb bursts without bounding it. By the time anyone looks there is a
          ten-minute backlog of requests whose clients disconnected nine minutes ago.`,
    build:`Add an in-flight limit and confirm that beyond it you get immediate 503s rather than slow
           200s. Compare total successful requests under a burst, both ways.`,
    refs:[] }

  ] },

{ num:10, id:"messaging", phase:4, name:"Messaging and event-driven architecture",
  lede:"Decoupling work in time, and the guarantees you actually get when you do.",
  topics:[

  { id:"broker-choice", name:"Queue, pub/sub or log", depth:"understand", core:true,
    why:`Three different shapes, not three products. And the guarantee everyone wants is not on offer:
         exactly-once <em>delivery</em> does not exist over an unreliable network.`,
    code:[{label:"What each shape gives you", lang:"text", code:`                 work queue     pub/sub         log
one message to   one consumer   all subscribers all consumer groups
retained after   acknowledgement delivery       a retention window
late subscriber  gets nothing   gets nothing    can replay from start
ordering         usually none   none            per partition
scaling          add workers    add subscribers add partitions
typical          SQS, RabbitMQ  SNS, Pub/Sub    Kafka, Redpanda

"Exactly once" as advertised means exactly-once processing WITHIN the
broker's own boundary: an offset commit and a state update made atomic
by the broker. The moment your consumer charges a card or calls an
external API you are back to at-least-once, and idempotency is the
only thing between you and a duplicate charge.`}],
    points:[
      `Pick by <b>who needs this, and for how long</b>. One consumer, no history: a queue. Several: pub/sub. Consumers that arrive later or need to rebuild by replaying: a log.`,
      `<b>At-most-once</b> is fine for metrics and never for money. <b>At-least-once</b> is the realistic default.`,
      `Design for duplicates from the start. Bolting it on later means auditing every handler you already wrote.`,
      `A log is strictly more capable and strictly more work: retention, partitions, offsets, consumer groups.`],
    trap:`Believing a broker's exactly-once setting covers your side effects. It covers its own
          bookkeeping; your handler charging a card twice is outside that boundary.`,
    build:`Classify every async message in your system as queue, pub/sub or log. Then for each, answer:
           what happens if it is delivered twice?`,
    refs:[] },

  { id:"consumer-idempotency", name:"Surviving a duplicate", depth:"build", core:true,
    why:`Duplicates are routine, not an edge case: a slow acknowledgement, a consumer restart, a
         rebalance. The fix is not stopping them — it is making the second run harmless.`,
    code:[{label:"Postgres: the dedupe record commits WITH the effect", lang:"sql", code:`create table processed (
  message_id text primary key,
  at         timestamptz not null default now()
);

begin;
  insert into processed (message_id) values ($1)
  on conflict do nothing;
  -- INSERT 0 1  -> we claimed it, do the work
  -- INSERT 0 0  -> already handled: skip and acknowledge

  update orders set status = 'paid' where id = $2;
commit;

-- Prune past the broker's maximum redelivery window:
delete from processed where at < now() - interval '7 days';`},
           {label:"Node: the three cases", lang:"js", code:`async function handle(msg) {
  await db.tx(async (tx) => {
    const claimed = await tx.claimMessage(msg.id);   // unique constraint
    if (!claimed) return;                            // duplicate: do nothing
    await applyEffect(tx, msg);                      // SAME transaction
  });
  await msg.ack();
}

// External side effects cannot join your transaction. Pass the message
// id as the provider's idempotency key so their side dedupes:
await gateway.charge(amount, { idempotencyKey: msg.id });

// Prefer naturally idempotent effects where the design allows:
//   set status = 'shipped'              safe to repeat
//   count = count + 1                   NOT safe
//   insert ... on conflict do nothing   safe to repeat`}],
    points:[
      `The producer sets a <b>stable id</b>, not the broker, so a republished message is recognisably the same event.`,
      `The dedupe record and the side effect must commit <b>together</b>. Two steps can fail between them.`,
      `Natural idempotency is free and constrains how you model the operation: store the resulting value, not the delta.`,
      `The table grows forever unless pruned.`],
    trap:`Recording the message as processed <em>after</em> doing the work, in a separate step. A crash
          in the gap means the redelivery does it all again — the exact case the table exists to prevent.`,
    build:`Deliver the same message twice deliberately and check the data. Add the processed table in the
           same transaction, repeat, then kill the consumer between the effect and the ack.`,
    refs:[] },

  { id:"ordering-partitions", name:"Ordering and partition keys", depth:"build", core:false,
    why:`Parallelism and ordering are in direct conflict. The compromise every log makes is to order
         within a partition, which makes the partition key a promise about what stays ordered.`,
    code:[{label:"The key decides what is ordered", lang:"text", code:`key = event type              key = order_id
  p0: created                   p0: order 7 created, paid, shipped
  p1: paid                      p1: order 8 created, cancelled
  p2: cancelled                 p2: order 9 created, paid

left:  nothing about ONE order is ordered. "cancelled" can arrive
       before "created" and the consumer fails on a missing row.
right: each order's events are strictly ordered. Different orders
       interleave freely, which nobody cares about.

Consumers in a group, 3 partitions:
  1 consumer  -> handles all 3
  3 consumers -> one each
  5 consumers -> three work, two sit idle

The partition count is the ceiling on parallelism, and raising it
later rehashes keys, so entities move partitions and lose ordering
relative to their own history.`}],
    points:[
      `Choose the <b>coarsest key whose ordering you actually need</b> — usually the entity, not the tenant.`,
      `A key with few distinct values concentrates traffic; a skewed one gives you a hot partition that adding consumers cannot help.`,
      `Make consumers tolerate out-of-order arrival anyway: carry a version and ignore anything older than what you applied.`,
      `A rebalance redelivers in-flight work elsewhere, which is another source of duplicates.`],
    trap:`A random partition key for throughput, with something downstream relying on ordering. It works
          under light load and fails under the load that made you want the throughput.`,
    build:`Write down your partition key and what ordering it guarantees. Find a consumer assuming a
           different one, and add a version check so an old message is ignored.`,
    refs:[] },

  { id:"dlq-retries", name:"Retries and dead letters", depth:"build", core:true,
    why:`Some failures are transient and some are permanent. Treating them the same is how one bad
         message blocks a partition, or how a brief outage discards a day of work.`,
    code:[{label:"Classify first, then retry or park", lang:"js", code:`const MAX_ATTEMPTS = 5;

async function consume(msg) {
  try {
    await handle(msg);
    return msg.ack();
  } catch (e) {
    if (!isRetryable(e)) {                  // parse error, constraint, bug
      await deadLetter(msg, e);             // no point retrying
      return msg.ack();
    }
    if (msg.attempts >= MAX_ATTEMPTS) {
      await deadLetter(msg, e);             // stop blocking the partition
      return msg.ack();
    }
    return msg.nack({ delay: backoff(msg.attempts) });
  }
}

const isRetryable = (e) =>
  e.code === 'ETIMEDOUT' || e.status === 503 || e.code === '40P01'; // deadlock

const backoff = (n) =>
  Math.min(2 ** n, 60) * 1000 * (0.5 + Math.random());   // jitter`}],
    points:[
      `A retry limit is mandatory. Without one a <b>poison message</b> blocks everything behind it in an ordered partition, forever.`,
      `The dead letter must carry the original message, the error and the attempt count, so it is diagnosable without a log search.`,
      `Replaying dead letters after a fix only works if the handler is idempotent.`,
      `For backoffs beyond a few seconds, push the delay back to the broker: a worker sleeping is a worker not doing the other work.`],
    trap:`A dead-letter queue with no alert. Messages land there silently, the system looks healthy, and
          the data loss is found weeks later when someone asks about a missing refund.`,
    build:`Put a deliberately malformed message in a queue and watch: how long it retries, whether it
           blocks anything, and whether anything tells you. Then add classification and an alert on depth.`,
    refs:[] },

  { id:"outbox", name:"The outbox pattern", depth:"build", core:false,
    why:`You cannot commit a database transaction and publish a message atomically. Whichever order you
         pick, a failure between the two leaves an order with no event, or an event for a rolled-back order.`,
    code:[{label:"Postgres: verified, including the relay claim", lang:"sql", code:`create table outbox (
  id           bigint generated always as identity primary key,
  aggregate_id bigint      not null,
  type         text        not null,
  payload      jsonb       not null,
  created_at   timestamptz not null default now(),
  published_at timestamptz
);
create index on outbox (id) where published_at is null;   -- relay's index

-- The write and the event commit TOGETHER, or neither does.
begin;
  insert into orders (customer_id, status, total_cents)
       values ($1, 'paid', $2) returning id as order_id;
  insert into outbox (aggregate_id, type, payload)
       values (:order_id, 'order.paid', jsonb_build_object(...));
commit;

-- The relay claims a batch. SKIP LOCKED lets several relay instances
-- run at once without two of them taking the same row.
update outbox set published_at = now()
 where id in (select id from outbox where published_at is null
              order by id limit 100 for update skip locked)
returning id, type, payload;`}],
    points:[
      `If the transaction rolls back, so does the event. That is exactly right.`,
      `The relay may publish and crash before marking the row, so the event goes out twice — fine, because consumers are idempotent.`,
      `<b>Change data capture</b> is the alternative: read the replication log, no outbox table, no relay. Heavier infrastructure, and the events are your schema rather than a contract you chose.`,
      `Order by id so events leave in the order they were created.`],
    trap:`Marking rows published before the broker confirms. A crash in that window loses the event
          permanently — the exact failure the outbox exists to prevent, reintroduced one line later.`,
    build:`Implement it for one event, then stop the broker, perform the operation, and confirm the order
           and its outbox row both committed and the event delivers when the broker returns.`,
    refs:[] },

  { id:"event-schemas", name:"Events are a contract", depth:"build", core:false,
    why:`Unlike an API, where you can see your callers, a published event can be consumed by a team that
         never told you. That makes event schemas harder to change, not easier.`,
    code:[{label:"An envelope worth standardising", lang:"json", code:`{
  "id":          "01J9F0G7Q0X2",
  "type":        "order.paid",
  "version":     1,
  "occurred_at": "2026-11-12T07:41:03.118Z",
  "subject":     "order/8841",
  "producer":    "orders-service",
  "data": {
    "order_id":    8841,
    "customer_id": 42,
    "total_cents": 4999,
    "currency":    "INR"
  }
}`},
           {label:"What each envelope field is for", lang:"text", code:`id           deduplication, and the key the consumer records
type         routing, and what tells a consumer to care
version      lets a consumer handle two shapes during a migration
occurred_at  when it HAPPENED, not when it was delivered
subject      the entity, so a consumer can order by it
data         the payload, and the only part that differs by type

Thin vs fat:
  thin  ids only -> consumers call back, and one event becomes a
        burst of requests at the producer, right when something
        interesting just happened
  fat   carries the data -> no call-back storm, and the data is a
        snapshot that may already be stale

Usual balance: identifiers plus the few fields that describe what
changed. Avoid publishing your whole entity: every field becomes
part of the contract.`}],
    points:[
      `Additive only. Never remove, rename or retype a field.`,
      `Name events in the past tense and in business language: <code>order.paid</code>, not <code>order_table_updated</code>.`,
      `The envelope stays stable even when payloads differ, which is what lets consumers route and dedupe without understanding the payload.`,
      `A schema registry earns its place once more than one team produces events.`],
    trap:`Publishing your database row as the event. The event's schema is now your table's schema, so a
          column rename breaks every consumer and internal fields you never meant to share are public.`,
    build:`Take one event you publish and check it has an id, type, version and timestamp. Then find out
           who consumes it — the uncertainty is why the additive-only rule exists.`,
    refs:[["CloudEvents","https://cloudevents.io/"]] },

  { id:"sagas", name:"Sagas and compensation", depth:"understand", core:false,
    why:`First ask whether these steps should be one service and one transaction, because usually they
         should. Needing a saga is most often a boundary drawn in the wrong place.`,
    code:[{label:"The shape, including what people skip", lang:"text", code:`place_order saga:

  step          forward              compensation
  1  stock      reserve(order)       release(order)
  2  payment    charge(card, key)    refund(charge_id)
  3  logistics  book(courier)        cancel(booking)
