body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr) var(--toc);

/* ---------- sidebar ---------- */
.side{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;
  padding:18px 10px 60px 16px;border-right:1px solid var(--line);scrollbar-width:thin}

.side h2:first-child{margin-top:0}
.sgroup{margin:0 0 2px}
.sgroup > button{width:100%;display:flex;align-items:flex-start;gap:8px;background:none;border:none;

.sgroup > button:hover{background:var(--line-soft)}
.sgroup > button .n{font-family:var(--mono);font-size:11px;color:var(--muted);width:16px;flex:none;line-height:1.55;padding-top:1px}
.sgroup > button .nm{flex:1;min-width:0}
.sgroup > button .done{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.55;padding-top:1px}
.sgroup.active > button{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}

.t-head{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline}
.t-head h3{font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em;margin:0;line-height:1.3}
.tick{position:relative;display:block;width:18px;height:18px;flex:none;cursor:pointer;top:3px}
.tick input{position:absolute;opacity:0;width:18px;height:18px;margin:0;cursor:pointer}
.tick span{position:absolute;inset:0;border:2px solid var(--line);border-radius:5px;background:var(--surface);pointer-events:none}
.tick input:checked + span{background:var(--accent);border-color:var(--accent)}
.tick input:checked + span::after{content:"";position:absolute;left:4.5px;top:1px;width:5px;height:9px;
  border:solid var(--on-accent);border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.tick input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
.t.done .t-head h3{color:var(--muted)}
.pills{display:flex;gap:6px;flex:none}

.p.build{background:var(--build-bg);color:var(--build)}

  background:var(--accent-soft);color:var(--accent-ink);padding:.08em .32em;border-radius:4px;overflow-wrap:anywhere}

/* stage footer */

/* ---------- toc ---------- */
.toc{position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow-y:auto;padding:28px 16px 60px 8px}
.toc h2{font-family:var(--display);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:0 0 8px;font-weight:700}
.toc ol{list-style:none;margin:0;padding:0}
.toc a{display:block;font-size:13px;color:var(--muted);text-decoration:none;padding:4px 8px;
  border-left:2px solid var(--line);line-height:1.35}

/* ---------- search results ---------- */

<script>
const stages = [
{ num:1, id:"foundations", phase:1, name:"Runtime foundations",
  lede:"What a running backend is made of, before any framework.",
  topics:[

  { id:"request-path", name:"The path of a request", depth:"understand", core:true,
    why:`A request crosses DNS, TCP, TLS, a proxy, your process and your database before anything
         comes back. Most production confusion is not knowing <em>which hop</em> was slow.`,
    code:[{label:"Split the time before blaming your code", lang:"bash", code:`curl -w '
dns      %{time_namelookup}s
connect  %{time_connect}s
tls      %{time_appconnect}s
first    %{time_starttransfer}s
total    %{time_total}s
' -o /dev/null -s https://api.example.com/orders`}],
    points:[
      `Read them as <b>differences</b>: <code>connect</code> minus <code>dns</code> is the TCP handshake,
       <code>tls</code> minus <code>connect</code> is TLS, <code>first</code> minus <code>tls</code> is your server working.`,
      `DNS is cached at several layers with separate TTLs, so a change never takes effect everywhere at once.`,
      `The proxy applies its own timeouts and body limits. The smaller of the two limits wins.`,
      `Your handler is one hop of five. Four can fail while your code is perfect.`],
    trap:`Calling an endpoint slow before splitting the timing. A 300ms handshake paid on every call
          is invisible in application metrics and obvious in these five numbers.`,
    build:`Run it against one of your endpoints from outside its network, then twice over a reused
           connection, and note which numbers collapse to zero.`,
    refs:[["curl: --write-out","https://curl.se/docs/manpage.html"]] },

  { id:"http-semantics", name:"HTTP semantics", depth:"build", core:true,
    why:`Clients branch on the status code, caches store by it, and retries depend on whether a method
         is safe to repeat. Getting this right costs nothing now and saves a class of bug later.`,
    code:[{label:"Express: codes that mean something", lang:"js", code:`app.post('/orders', async (req, res) => {
  const errors = validate(req.body);
  if (errors) return res.status(422).json({ code: 'VALIDATION_FAILED', errors });

  const order = await orders.create(req.body, req.user.id);
  res.status(201).location(\`/orders/\${order.id}\`).json(order);   // 201 + Location
});

app.get('/orders/:id', async (req, res) => {
  const order = await orders.find(req.params.id, req.user.id);
  // 404 rather than 403: do not confirm someone else's order exists
  if (!order) return res.status(404).json({ code: 'NOT_FOUND' });
  res.json(order);
});

app.put('/orders/:id/status', async (req, res, next) => {
  try   { res.json(await orders.setStatus(req.params.id, req.body.status)); }
  catch (e) {
    if (e.code === 'ALREADY_SHIPPED')                   // conflict with current state,
      return res.status(409).json({ code: e.code });    // not bad input
    next(e);
  }
});`}],
    points:[
      `<b>Safe</b> (RFC 9110): GET, HEAD, OPTIONS, TRACE. A crawler may call these unasked, so never change state in one.`,
      `<b>Idempotent</b>: PUT and DELETE plus the safe ones. POST is neither, which is why creation needs an idempotency key.`,
      `<b>400 vs 422</b>: malformed versus parsed but unacceptable. <b>401 vs 403</b>: authenticating may help versus it will not.`,
      `<b>429</b> is defined in RFC 6585, not 9110, and should carry <code>Retry-After</code>.`],
    trap:`Returning 200 with an error in the body. Every client's error branch stops working and a
          shared cache is entitled to store it.`,
    build:`List every endpoint with its method and codes. Find the GET that changes something and the
           200 that is really an error.`,
    refs:[["RFC 9110","https://www.rfc-editor.org/rfc/rfc9110.html"],
          ["RFC 6585","https://www.rfc-editor.org/rfc/rfc6585.html"]] },

  { id:"concurrency-models", name:"One thread, many requests", depth:"understand", core:false,
    why:`Node serves thousands of concurrent requests on one thread by never waiting. Anything that
         does not yield stops every other request on that process.`,
    code:[{label:"A 10ms timer, two seconds late", lang:"js", code:`const t0 = Date.now();
setTimeout(() => console.log('timer after', Date.now() - t0, 'ms'), 10);

const { createHash } = require('node:crypto');
let h = 'seed';
for (let i = 0; i < 2_000_000; i++) h = createHash('sha256').update(h).digest('hex');
console.log('work done after', Date.now() - t0, 'ms');

// work done after 2100 ms
// timer after 2102 ms      <- a 10ms timer, two seconds late`}],
    points:[
      `Only <b>I/O</b> yields. <code>await</code> on a computation yields nothing, and a CPU loop blocks the loop entirely.`,
      `Capacity is bounded by memory and by whatever is scarcest downstream, not by CPU. That is usually the database pool.`,
      `Move CPU-bound work to a <code>worker_threads</code> pool or another service. Do not try to make it async.`,
      `Scaling out multiplies pressure on everything downstream, so more instances is not always more throughput.`],
    trap:`Assuming more concurrency means more throughput. Past the point where the real bottleneck
          saturates, extra in-flight requests only add queueing.`,
    build:`Run that snippet, then yield every few thousand iterations with
           <code>await new Promise(r =&gt; setImmediate(r))</code> and watch the timer recover.`,
    refs:[["Node: the event loop","https://nodejs.org/en/learn/asynchronous-work/event-loop-timers-and-nexttick"]] },

  { id:"linux-basics", name:"The Linux you need", depth:"understand", core:false,
    why:`Your service is a process in a container. A handful of operating system facts explain the
         restarts and hangs that look inexplicable from inside the application.`,
    code:[{label:"Four questions worth answering from a shell", lang:"bash", code:`ss -tanp | head            # sockets: are they piling up in CLOSE_WAIT?
lsof -p "$PID" | wc -l     # how many file descriptors are open?
cat /proc/"$PID"/limits    # what are the kernel's limits for this process?
cat /sys/fs/cgroup/memory.max   # the memory ceiling that actually applies`}],
    points:[
      `<b>Exit 137</b> is 128 + 9, meaning SIGKILL, and in a container that is almost always the OOM killer. <b>143</b> is a normal SIGTERM.`,
      `Every socket and file is a descriptor with a limit. Leaked connections exhaust it and you get "too many open files".`,
      `<b>PID 1</b> gets no default signal handlers. If a shell wraps your app, SIGTERM never reaches it and every deploy is a hard kill.`,
      `Inside a container, limits come from the cgroup. Tools reading host figures will report the wrong memory entirely.`],
    trap:`Reading exit 137 as an application error. The process was killed from outside and never ran
          a line of your shutdown code, so there is nothing in your logs to find.`,
    build:`Record your service's open descriptor count, fire a few hundred requests, and check it comes
           back down. A number that only climbs is a leak.`,
    refs:[["man7: signal(7)","https://man7.org/linux/man-pages/man7/signal.7.html"]] },

  { id:"config-secrets", name:"Configuration and secrets", depth:"build", core:true,
    why:`Anything that differs between laptop, staging and production belongs outside the artifact, so
         one build runs anywhere. Secrets are configuration with a blast radius.`,
    code:[{label:"Fail the deploy, not the request", lang:"js", code:`const required = ['DATABASE_URL', 'REDIS_URL', 'JWT_SIGNING_KEY'];
const missing = required.filter((k) => !process.env[k]);
if (missing.length) {
  console.error(\`refusing to start: missing \${missing.join(', ')}\`);
  process.exit(78);                              // EX_CONFIG
}

module.exports = Object.freeze({
  databaseUrl: process.env.DATABASE_URL,
  redisUrl:    process.env.REDIS_URL,
  jwtKey:      process.env.JWT_SIGNING_KEY,
  timeoutMs:   Number(process.env.REQUEST_TIMEOUT_MS ?? 3000),
  env:         process.env.NODE_ENV ?? 'development',
});

// $ DATABASE_URL=x node config.js
// refusing to start: missing REDIS_URL, JWT_SIGNING_KEY   (exit 78)`}],
    points:[
      `Validate the whole config at startup and exit non-zero. A service that starts and then misbehaves is far harder to diagnose.`,
      `Read the environment in <b>one module</b> and pass the frozen object around, so there is exactly one place a typo can hide.`,
      `Never bake a secret into an image: it stays in the layer history even if a later layer deletes it.`,
      `Support two valid values during a rotation, or the secret will never be rotated.`],
    trap:`Logging the config object at startup to help debugging. It works, and it puts your database
          password in every log aggregator with a long retention period.`,
    build:`Add startup validation to one service, then count the direct <code>process.env</code> reads
           left outside that module. Each one is a place a typo survives.`,
    refs:[["The twelve-factor app: config","https://12factor.net/config"]] },

  { id:"layering", name:"Layers and boundaries", depth:"build", core:true,
    why:`Three responsibilities: speak HTTP, decide what happens, talk to storage. Keeping them apart
         is what lets you test the decision without a web server or a database.`,
    code:[{label:"Express: the route holds no rules", lang:"js", code:`// routes/orders.js — knows HTTP, nothing else
router.post('/:id/cancel', async (req, res, next) => {
  try {
    const order = await req.services.orders.cancel(req.params.id, req.user.id);
    res.json(toApi(order));                        // map out: never leak the row
  } catch (e) {
    if (e.code === 'NOT_OWNED')      return res.status(404).json({ code: e.code });
    if (e.code === 'ALREADY_SHIPPED') return res.status(409).json({ code: e.code });
    next(e);
  }
});

// services/orders.js — knows the rules, nothing about HTTP
function makeOrders({ repo, payments, clock }) {        // dependencies injected
  return {
    async cancel(id, userId) {
      const order = await repo.find(id);
      if (!order || order.userId !== userId) throw err('NOT_OWNED');
      if (order.shipped)                    throw err('ALREADY_SHIPPED');
      await payments.refund(order.paymentId);
      return repo.save({ ...order, cancelledAt: clock.now() });
    },
  };
}`}],
    points:[
      `The rule now has <b>one</b> home, so the API, a nightly job and a support script cannot drift apart.`,
      `Injecting <code>repo</code>, <code>payments</code> and <code>clock</code> is what makes the rule testable with no database and no fake timers.`,
      `Map rows to an API shape on the way out, or every column rename becomes a breaking API change.`,
      `Three layers is overkill for an endpoint that reads a table and returns it. Add the service at the second caller, or the first real rule.`],
    trap:`Returning database rows straight from a route. It saves a mapping function on day one and
          publishes every column you later add.`,
    build:`Extract one real rule into a function taking plain arguments, and write a test for it that
           starts no server and opens no connection.`,

    code:[{label:"Why money is never a float", lang:"js", code:`console.log(0.1 + 0.2);              // 0.30000000000000004
console.log(0.1 + 0.2 === 0.3);      // false

let total = 0;
for (let i = 0; i < 1000; i++) total += 0.1;
console.log(total);                  // 99.9999999999986

let cents = 0;
for (let i = 0; i < 1000; i++) cents += 10;
console.log(cents / 100);            // 100      <- integer minor units, exact`}],
    points:[
      `Store and send money as <b>integer minor units</b> plus a currency code. A JSON number is a double on the other side, whatever you did.`,
      `Timestamps: UTC, ISO 8601, always with an offset. A bare local time is a bug waiting for a server in another region.`,
      `In a PATCH, <code>null</code> means clear and absent means leave alone. If your parser collapses them you cannot express one.`,

/* ------------------------------------------------------------------ *
 * Renderer. The route is data; this file turns it into the page.
 * One stage is shown at a time: the sidebar is the navigation, and
 * nothing inside a stage is collapsed.
 * ------------------------------------------------------------------ */
const DEPTH = { build: "Build", understand: "Understand" };
const KEY   = "backend:done:v1";

const $ = (s) => document.querySelector(s);
const side = $("#side"), main = $("#main"), tocEl = $("#toc"), progEl = $("#prog");

const allTopics = [];
stages.forEach((s) => (s.topics || []).forEach((t) => allTopics.push({ ...t, stage: s })));

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} };

const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");

/* ---------------- sidebar ---------------- */
const PHASES = ["Foundations", "Build the service", "Secure and fast",
                "Async and integrate", "Operate", "Scale"];

function buildSidebar() {
  let html = "", phase = 0;
  for (const s of stages) {
    if (s.phase !== phase) { phase = s.phase; html += `<h2>${PHASES[phase - 1]}</h2>`; }
    const n = (s.topics || []).filter((t) => done.has(t.id)).length;
    const tot = (s.topics || []).length;
    html += `<div class="sgroup" data-stage="${s.id}">
      <button type="button" data-go="${s.id}">
        <span class="n">${s.num}</span><span class="nm">${s.name}</span>
        ${tot ? `<span class="done">${n}/${tot}</span>` : ""}
      </button>
      <ul>${(s.topics || []).map((t) =>
        `<li><a href="#${t.id}" class="${done.has(t.id) ? "ok" : ""}">${t.name}</a></li>`).join("")}</ul>
    </div>`;
  }
  side.innerHTML = html;
}

/* ---------------- one topic ---------------- */
function topicHTML(t) {
  let h = `<article class="t${done.has(t.id) ? " done" : ""}" id="${t.id}" data-topic="${t.id}">
    <div class="t-head">
      <label class="tick"><input type="checkbox" ${done.has(t.id) ? "checked" : ""}
        aria-label="Mark ${esc(t.name)} as done"><span></span></label>
      <h3>${t.name}</h3>
      <span class="pills">${t.core ? '<i class="p core">Core</i>' : ""}<i class="p ${t.depth}">${DEPTH[t.depth]}</i></span>
    </div>
    <p class="t-why">${t.why}</p>`;

  (t.code || []).forEach(() => { h += `<figure class="snip"><figcaption></figcaption><pre><code></code></pre></figure>`; });
  if (t.points && t.points.length) h += `<ul class="pts">${t.points.map((p) => `<li>${p}</li>`).join("")}</ul>`;
  if (t.trade) h += `<p class="band trade"><b>Trade-off.</b> ${t.trade}</p>`;
  if (t.trap)  h += `<p class="band trap"><b>Pitfall.</b> ${t.trap}</p>`;
  if (t.build) h += `<p class="band do"><b>Build it.</b> ${t.build}</p>`;
  if (t.refs && t.refs.length)
    h += `<p class="refs">${t.refs.map(([l, u]) => `<a href="${u}" target="_blank" rel="noopener">${l}</a>`).join(" · ")}</p>`;
  return h + `</article>`;
}

/* ---------------- one stage ---------------- */
let current = null;

function showStage(id, topicId) {
  const i = stages.findIndex((s) => s.id === id);
  const s = stages[i < 0 ? 0 : i];
  current = s.id;

  const prev = stages[i - 1], next = stages[i + 1];
  let h = `<div class="stage-head">
      <p class="kicker">Stage ${s.num} of ${stages.length}</p>
      <h1>${s.name}</h1>
      <p class="lede">${s.lede}</p>`;
  if (s.topics) {
    const b = s.topics.filter((t) => t.depth === "build").length;
    const c = s.topics.filter((t) => t.core).length;
    h += `<div class="stage-meta"><span class="chip">${s.topics.length} topics</span>
      <span class="chip">${c} core</span><span class="chip">${b} to build</span></div>`;
  }
  h += `</div>`;
  h += s.custom ? s.custom : (s.topics || []).map(topicHTML).join("");
  h += `<nav class="pager">`;
  if (prev) h += `<a class="prev" href="#${prev.id}"><span class="dir">← Stage ${prev.num}</span><span class="ttl">${prev.name}</span></a>`;
  if (next) h += `<a class="next" href="#${next.id}"><span class="dir">Stage ${next.num} →</span><span class="ttl">${next.name}</span></a>`;
  h += `</nav>`;
  main.innerHTML = h;

  // snippets: textContent so nothing is interpreted as markup
  const figs = main.querySelectorAll("figure.snip");
  let k = 0;
  for (const t of s.topics || []) for (const c of t.code || []) {
    const f = figs[k++];
    f.querySelector("figcaption").textContent = c.label;
    const el = f.querySelector("code");
    el.textContent = c.code;
    if (c.lang) el.dataset.lang = c.lang;
  }
  highlight();
  wireTicks();
  buildToc(s);
  markSidebar();

  if (topicId) {
    const el = document.getElementById(topicId);
    if (el) el.scrollIntoView();
  } else {
    window.scrollTo({ top: 0, behavior: "auto" });
  }
}

/* ---------------- on this page ---------------- */
let spy = null;
function buildToc(s) {
  if (!s.topics || !s.topics.length) { tocEl.innerHTML = ""; return; }
  tocEl.innerHTML = `<h2>On this page</h2><ol>` +
    s.topics.map((t) => `<li><a href="#${t.id}">${t.name}</a></li>`).join("") + `</ol>`;
  if (spy) spy.disconnect();
  const links = new Map([...tocEl.querySelectorAll("a")].map((a) => [a.getAttribute("href").slice(1), a]));
  spy = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      tocEl.querySelectorAll("a.here").forEach((a) => a.classList.remove("here"));
      const a = links.get(e.target.id);
      if (a) a.classList.add("here");
    }
  }, { rootMargin: "-80px 0px -70% 0px" });
  main.querySelectorAll("article.t").forEach((el) => spy.observe(el));
}

function markSidebar() {
  side.querySelectorAll(".sgroup").forEach((g) =>
    g.classList.toggle("active", g.dataset.stage === current));
  const g = side.querySelector(".sgroup.active");
  if (g && g.offsetTop < side.scrollTop) side.scrollTop = Math.max(0, g.offsetTop - 80);
}

/* ---------------- progress ---------------- */
function refreshProgress() {
  progEl.textContent = `${done.size} / ${allTopics.length} done`;
  for (const g of side.querySelectorAll(".sgroup")) {
    const s = stages.find((x) => x.id === g.dataset.stage);
    const el = g.querySelector(".done");
    if (el) el.textContent = `${(s.topics || []).filter((t) => done.has(t.id)).length}/${s.topics.length}`;
    g.querySelectorAll("li a").forEach((a) =>
      a.classList.toggle("ok", done.has(a.getAttribute("href").slice(1))));
  }
}

function wireTicks() {
  main.querySelectorAll("article.t").forEach((art) => {
    const box = art.querySelector("input[type=checkbox]");
    box.addEventListener("change", () => {
      box.checked ? done.add(art.dataset.topic) : done.delete(art.dataset.topic);
      art.classList.toggle("done", box.checked);
      save(); refreshProgress();
    });
  });
}

/* ---------------- search ---------------- */
const q = $("#q");
function plain(html) { return String(html).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim(); }
const haystack = allTopics.map((t) => ({
  t, s: (t.name + " " + plain(t.why || "") + " " + (t.points || []).map(plain).join(" ") + " " +
         plain(t.trap || "") + " " + plain(t.trade || "")).toLowerCase(),
}));

function runSearch(term) {
  const n = term.trim().toLowerCase();
  if (!n) { showStage(current || stages[0].id); return; }
  const hits = haystack.filter((h) => h.s.includes(n)).slice(0, 60);
  const mark = (s) => esc(s).replace(new RegExp("(" + n.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig"), "<mark>$1</mark>");
  main.innerHTML = `<div class="results"><h1 class="stage-head" style="font-size:1.4rem">Search</h1>
    <p class="count">${hits.length ? hits.length + " topic" + (hits.length === 1 ? "" : "s") : "No topic"} matching “${esc(term.trim())}”</p>` +
    hits.map(({ t }) => `<a class="hit" href="#${t.id}">
      <span class="hn">${mark(t.name)}</span>
      <span class="hs">${mark(plain(t.why).slice(0, 150))}…</span>
      <span class="hw">Stage ${t.stage.num} · ${t.stage.name}</span></a>`).join("") + `</div>`;
  tocEl.innerHTML = "";
  if (spy) spy.disconnect();
}
let tmr;
q.addEventListener("input", () => { clearTimeout(tmr); tmr = setTimeout(() => runSearch(q.value), 120); });
q.addEventListener("keydown", (e) => { if (e.key === "Escape") { q.value = ""; runSearch(""); q.blur(); } });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); q.focus();
  }
});

/* ---------------- routing ---------------- */
function go(hash, push) {
  const id = decodeURIComponent((hash || "").replace(/^#/, ""));
  if (!id) return showStage(stages[0].id);
  const stage = stages.find((s) => s.id === id);
  if (stage) return showStage(stage.id);
  const t = allTopics.find((x) => x.id === id);
  if (t) return showStage(t.stage.id, t.id);
  showStage(stages[0].id);
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-go]");
  if (b) { location.hash = b.dataset.go; side.classList.remove("open"); return; }
  const a = e.target.closest('a[href^="#"]');
  if (a && a.getAttribute("href").length > 1) {
    const id = a.getAttribute("href").slice(1);
    if (location.hash.slice(1) === id) { go("#" + id); }   // same hash: re-run
    side.classList.remove("open");
  }
});
window.addEventListener("hashchange", () => { if (q.value) { q.value = ""; } go(location.hash); });

/* ---------------- chrome ---------------- */
$("#menu").addEventListener("click", (e) => {
  const open = side.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});
const themeBtn = $("#theme");
try {
  const saved = localStorage.getItem("backend:theme:v1");
  if (saved) document.documentElement.dataset.theme = saved;
} catch (e) {}
themeBtn.addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("backend:theme:v1", next); } catch (e) {}
});

function highlight() {
  if (!window.hljs) return;
  const map = { js: "javascript", sql: "sql", yaml: "yaml", bash: "bash", json: "json" };
  main.querySelectorAll("pre code").forEach((el) => {
    const lang = map[el.dataset.lang];
    if (!lang) return;
    el.classList.add("language-" + lang);
    try { hljs.highlightElement(el); } catch (e) {}
  });
}

buildSidebar();
refreshProgress();
go(location.hash);
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
        onload="highlight()"></script>
</body>
